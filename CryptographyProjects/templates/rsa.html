<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RSA Encryption Tool</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #1e1e2e; color: #cdd6f4; padding: 40px; }
        .container { max-width: 700px; margin: auto; background: #313244; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        h2 { text-align: center; color: #cdd6f4; margin-bottom: 10px; }
        p.subtitle { text-align: center; color: #a6adc8; margin-bottom: 30px; font-size: 0.95em; }

        .back-link { color: #89b4fa; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }

        .tab-container { display: flex; gap: 10px; margin-bottom: 25px; justify-content: center; }
        .tab { padding: 10px 20px; cursor: pointer; background: #45475a; border-radius: 6px; font-weight: 500; transition: background 0.2s, color 0.2s; }
        .tab.active { background: #89b4fa; color: #11111b; font-weight: bold; }

        .section { display: none; }
        .section.active { display: block; }

        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        label { display: block; color: #89b4fa; font-size: 0.9em; font-weight: 600; }
        input, select { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #45475a; background: #181825; color: white; box-sizing: border-box; }
        input[type="file"] { padding: 9px; cursor: pointer; }

        button { background: #a6e3a1; color: #11111b; border: none; padding: 14px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1em; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }

        .status { margin-top: 20px; padding: 15px; border-radius: 6px; text-align: center; display: none; font-weight: 500; }
        .status-visible { display: block; margin-bottom: 20px; }
        .success { background: rgba(166, 227, 161, 0.15); border: 1px solid #a6e3a1; color: #a6e3a1; }
        .error { background: rgba(243, 139, 168, 0.15); border: 1px solid #f38ba8; color: #f38ba8; }
    </style>
</head>
<body>

    <div class="container">
        <a href="/" class="back-link">&lt; Back to Hub</a>
        <h2>RSA Encryption & Decryption</h2>
        <div class="tab-container">
            <div class="tab active" id="generateTab" onclick="switchMode('generate')">Key Generation</div>
            <div class="tab" id="encryptTab" onclick="switchMode('encrypt')">Encrypt File</div>
            <div class="tab" id="decryptTab" onclick="switchMode('decrypt')">Decrypt File</div>
        </div>

        {% if error %}
        <div class="status error status-visible">{{ error }}</div>
        {% endif %}
        {% if message %}
        <div class="status success status-visible">{{ message }}</div>
        {% endif %}

        <div id="generateSection" class="section active">
            <form action="/rsa" method="POST">
                <input type="hidden" name="action" value="generate_keys">
                <div class="input-group">
                    <label for="key_size">Key Size:</label>
                    <select name="key_size" id="key_size">
                        <option value="1024">1024 bits</option>
                        <option value="2048" selected>2048 bits</option>
                        <option value="3072">3072 bits</option>
                    </select>
                </div>
                <button type="submit">Generate and Download Keys</button>
            </form>
        </div>

        <div id="encryptSection" class="section">
            <form action="/rsa" method="POST" enctype="multipart/form-data">
                <input type="hidden" name="action" value="encrypt">
                <div class="input-group">
                    <label for="file_to_encrypt">File to Encrypt:</label>
                    <input id="file_to_encrypt" type="file" name="file_to_encrypt" required>
                </div>
                <div class="input-group">
                    <label for="public_key_encrypt">Public Key (.pem):</label>
                    <input id="public_key_encrypt" type="file" name="public_key" accept=".pem" required>
                </div>
                <button type="submit">Encrypt File</button>
            </form>
        </div>

        <div id="decryptSection" class="section">
            <form action="/rsa" method="POST" enctype="multipart/form-data">
                <input type="hidden" name="action" value="decrypt">
                <div class="input-group">
                    <label for="file_to_decrypt">File to Decrypt (encrypted.bin):</label>
                    <input id="file_to_decrypt" type="file" name="file_to_decrypt" required>
                </div>
                <div class="input-group">
                    <label for="private_key_decrypt">Private Key (.pem):</label>
                    <input id="private_key_decrypt" type="file" name="private_key" accept=".pem" required>
                </div>
                <button type="submit">Decrypt File</button>
            </form>
        </div>

    </div>

    <script>
        function switchMode(mode) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));

            document.getElementById(mode + 'Section').classList.add('active');
            document.getElementById(mode + 'Tab').classList.add('active');

            localStorage.setItem('rsaActiveTab', mode);
            hideMessages();
        }

        function hideMessages() {
            document.querySelectorAll('.status').forEach(el => {
                el.classList.remove('status-visible');
                el.style.display = 'none';
            });
        }

        window.onload = function() {
            const activeTab = localStorage.getItem('rsaActiveTab') || 'generate';
            switchMode(activeTab);
        };
    </script>
</body>
</html>
